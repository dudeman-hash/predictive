name: Build iOS Geode mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build for iOS
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: iOS
          sdk: v5.11.2
          bindings: geode-sdk/bindings
          bindings-ref: 46f245f085e12674a6a44d708dff394722e03ee4
          configure-args: -DSKIP_BUILDING_CODEGEN=OFF

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: PredictiveInputBuffer-iOS
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
